# Render Blueprint — Loan Officer Sales Coach
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: loan-officer-sales-coach
    runtime: node
    plan: free
    # Repo root should contain proxy.js + index.html + package.json
    buildCommand: npm install --omit=dev
    startCommand: node proxy.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: XAI_API_KEY
        sync: false
      # Partner share links → live Realtor app
      - key: REALTOR_APP_URL
        value: "https://ruoffagentsalescoach.onrender.com"
      # Optional: dedicated signing secret for durable partner tokens (else falls back to XAI_API_KEY)
      - key: PARTNER_CARD_SECRET
        sync: false
      # Optional: lock CORS to your Render URL(s), e.g.
      # https://loanofficersalescoach.onrender.com,https://ruoffagentsalescoach.onrender.com
      # Leave unset to allow all origins (default).
      - key: CORS_ORIGINS
        sync: false
